<!doctype html>
<html lang="es">
  <head>

    <meta name="description" content="Transporte ejecutivo de personas y encomiendas entre Portoviejo, Pedernales y ciudades intermedias. Confort, seguridad y puntualidad." />
    <meta property="og:title" content="PACHA - Transporte Ejecutivo" />

    <meta property="og:type" content="website" />
    <meta name="theme-color" content="#0a192f" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="PACHA" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />

    <link rel="preconnect" href="https://fonts.googleapis.com">

  <body class="bg-slate-900 text-slate-100 antialiased selection:bg-amber-500 selection:text-slate-900 min-h-screen overflow-x-hidden w-full max-w-full">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Register PWA service worker
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch(err => {
            console.log('SW registration note:', err);
          });
        });
      }
    </script>
  </body>
